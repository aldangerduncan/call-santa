<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Call Santa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call Santa">
<meta name="theme-color" content="#0B1E3A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-top: #15264a;
    --navy-bot: #060f22;
    --cream: #fff9ea;
    --red: #cb1430;
    --gold: #e8b33a;
  }

  html, body {
    min-height: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--cream);
    background: var(--navy-bot);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 80% at 50% 8%, rgba(232,179,58,.10) 0%, rgba(232,179,58,0) 55%),
      linear-gradient(170deg, var(--navy-top) 0%, #0b1a35 45%, var(--navy-bot) 100%);
  }

  /* layered starfield, drawn as box-shadows so it costs nothing */
  .stars { position: fixed; inset: 0; opacity: .85; }
  .stars span {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: var(--cream);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:.95 } }

  .snow { position: fixed; inset: 0; pointer-events: none; }
  .flake {
    position: absolute;
    top: -12vh;
    border-radius: 50%;
    background: #fff;
    opacity: .75;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -12vh, 0); }
    100% { transform: translate3d(var(--drift, 2vw), 112vh, 0); }
  }

  .ground {
    position: fixed;
    left: -5%; right: -5%; bottom: -6vh;
    height: 26vh;
    background: var(--cream);
    border-radius: 50% 50% 0 0 / 22vh 22vh 0 0;
    opacity: .96;
  }

  .wrap {
    position: relative;
    /* 100dvh tracks Safari's shrinking viewport as the toolbar appears.
       The vh line is the fallback for browsers without dvh. */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 6vh) 24px calc(env(safe-area-inset-bottom) + 132px);
    text-align: center;
  }

  .kicker {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: .9;
  }

  h1 {
    margin-top: 10px;
    font-size: clamp(42px, 13vw, 68px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -.01em;
    text-shadow: 0 2px 24px rgba(0,0,0,.45);
  }

  .sub {
    margin-top: 12px;
    font-size: clamp(15px, 4.2vw, 18px);
    font-weight: 400;
    color: rgba(255,249,234,.72);
    max-width: 19ch;
  }

  .hat {
    width: clamp(96px, 28vw, 132px);
    height: auto;
    margin-top: 4vh;
    filter: drop-shadow(0 10px 28px rgba(0,0,0,.5));
    border-radius: 24px;
  }

  .widget-slot {
    margin-top: auto;
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 5;
  }

  .hint {
    position: relative;
    z-index: 5;
    margin-top: 14px;
    font-size: 12px;
    color: #0b1a35;
    opacity: .55;
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    .flake, .stars span { animation: none; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="snow" id="snow"></div>
  <div class="ground"></div>
  <div class="wrap">
    <p class="kicker">North Pole</p>
    <h1>Call Santa</h1>
    <p class="sub">Your own line to the workshop</p>
    <img class="hat" src="icon-512.png" alt="">

    <div class="widget-slot">
      <elevenlabs-convai agent-id="agent_5601m830ajcdf3nap2e8rc7rsesr"></elevenlabs-convai>
    </div>
  </div>

  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  <script>
    // starfield
    (function () {
      const host = document.getElementById('stars');
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 70; i++) {
        const s = document.createElement('span');
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top = (Math.random() * 62) + 'vh';
        const sz = Math.random() < 0.18 ? 3 : 2;
        s.style.width = s.style.height = sz + 'px';
        s.style.animationDelay = (Math.random() * 4) + 's';
        frag.appendChild(s);
      }
      host.appendChild(frag);
    })();

    // snow
    (function () {
      const host = document.getElementById('snow');
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 48; i++) {
        const f = document.createElement('div');
        f.className = 'flake';
        const sz = 2 + Math.random() * 5;
        f.style.width = f.style.height = sz + 'px';
        f.style.left = (Math.random() * 100) + 'vw';
        f.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
        f.style.setProperty('--drift', (Math.random() * 14 - 7).toFixed(1) + 'vw');
        f.style.animationDuration = (9 + Math.random() * 14).toFixed(1) + 's';
        f.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
        frag.appendChild(f);
      }
      host.appendChild(frag);
    })();

    // stop a small person pinch-zooming or double-tapping the layout apart
    document.addEventListener('gesturestart', e => e.preventDefault());
    let lastTouch = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouch < 320) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
  </script>
</body>
</html>
